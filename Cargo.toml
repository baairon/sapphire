[workspace]
resolver = "2"
members = [
    "crates/lift-1",
    "crates/lift-2",
    "crates/lift-3",
    "crates/lift-4",
    "crates/lift-5",
    "crates/lift-6",
    "crates/lift-7",
    "crates/lift-8",
    "crates/lift-a",
    "crates/lift-b",
    "crates/neutral-ffmpeg",
    "crates/neutral-handoff",
    "crates/neutral-parity",
    "crates/neutral-world",
    # the effect crates (docs/adding-an-effect.md, Crate layout): the engine and support crates by path, then every kernel crate through one glob
    "crates/effects/fx_common",
    "crates/effects/fx_device",
    "crates/effects/fx_eval",
    "crates/effects/fx_exec",
    "crates/effects/rtdata",
    "crates/effects/vecdir",
    "crates/effects/kernels/*",
]
# The lifted crates (lift-1 to lift-8, lift-a, lift-b) test against stored vectors that are not in
# the repository, so a plain `cargo test` runs the tests of the four crates below (plus the effect crates listed after them) and none
# of those. neutral-handoff depends on fx_exec for the in-process effect stages, so building it also builds fx_exec and its
# dependencies, but the fx_exec tests are not part of the default run.
default-members = [
    "crates/neutral-world",
    "crates/neutral-parity",
    "crates/neutral-ffmpeg",
    "crates/neutral-handoff",
    # The effect crates whose tests need no stored vectors and no data taken from the original, pass on x86_64 and (under qemu) on
    # aarch64, and call no platform libm function: 52 of the 68 effect crates. The others (fx_eval, fx_exec and the crates whose tests
    # read stored test data) stay out, like the lift crates; docs/effects.md gives their test command.
    "crates/effects/fx_common",
    "crates/effects/kernels/add_rgb",
    "crates/effects/kernels/blur",
    "crates/effects/kernels/blur_coef",
    "crates/effects/kernels/blur_rows",
    "crates/effects/kernels/blur_rows_y",
    "crates/effects/kernels/blur_warp",
    "crates/effects/kernels/blur_warp_1ch",
    "crates/effects/kernels/blur_warp_2ch",
    "crates/effects/kernels/blur_warp_3ch",
    "crates/effects/kernels/blur_warp_4ch",
    "crates/effects/kernels/blur_warp_point",
    "crates/effects/kernels/comp_premult",
    "crates/effects/kernels/comp_rgba",
    "crates/effects/kernels/convert_pair",
    "crates/effects/kernels/copy_planes",
    "crates/effects/kernels/dissolve",
    "crates/effects/kernels/format14_read",
    "crates/effects/kernels/format14_read_b",
    "crates/effects/kernels/format14_write",
    "crates/effects/kernels/grad",
    "crates/effects/kernels/hue_shift",
    "crates/effects/kernels/hue_shift_preserve_luma",
    "crates/effects/kernels/libm_fmod",
    "crates/effects/kernels/libm_powf",
    "crates/effects/kernels/libm_sincos",
    "crates/effects/kernels/masked_blur",
    "crates/effects/kernels/monochrome",
    "crates/effects/kernels/monochrome_a",
    "crates/effects/kernels/one_minus",
    "crates/effects/kernels/ops_arith",
    "crates/effects/kernels/ops_clamp",
    "crates/effects/kernels/ops_coerce",
    "crates/effects/kernels/ops_diff",
    "crates/effects/kernels/ops_element",
    "crates/effects/kernels/ops_if",
    "crates/effects/kernels/ops_minmax",
    "crates/effects/kernels/ops_vec",
    "crates/effects/kernels/perspective",
    "crates/effects/kernels/perspective_alpha",
    "crates/effects/kernels/plane_service",
    "crates/effects/kernels/sat_scale",
    "crates/effects/kernels/scale_rgb",
    "crates/effects/kernels/screen_super",
    "crates/effects/kernels/static2",
    "crates/effects/kernels/tickmap",
    "crates/effects/kernels/v3_to_v4_if4",
    "crates/effects/kernels/warp_driver",
    "crates/effects/kernels/warp_log_gradient",
    "crates/effects/kernels/warp_rel",
    "crates/effects/kernels/warp_rel_sampler",
    "crates/effects/kernels/warp_sampler",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["bairon"]
publish = false
