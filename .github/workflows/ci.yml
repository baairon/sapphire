name: CI

on:
  # Every push to main runs, so main always carries a check of its own, and so
  # does every pull request.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# On a pull request a new push supersedes the run in flight: only the branch's
# latest commit needs a verdict. A push to main is never cancelled and never
# waits behind another one: each is a group of its own, so commits pushed one
# after another all keep a result of their own.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # One platform failing should never hide the result on the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The ffmpeg bridge tests render raw frames with ffmpeg and compare its
      # pixel format table with the live binary, so Linux uses the same static
      # 9.0 build as the other repositories.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSfL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-n9.0-latest-linux64-gpl-9.0/bin" >> "$GITHUB_PATH"

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      # The same static 9.0 build on Windows: the Chocolatey package puts a launcher in
      # front of ffmpeg, and a timeout ends the launcher but not the ffmpeg it started.
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-9.0.zip -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\ffmpeg-n9.0-latest-win64-gpl-9.0\bin"

      # The workspace tests its default members: the harness, the parity
      # replayer, the ffmpeg bridge and the handoff pipeline, in the release
      # profile the parity runs use. The lifted crates need the stored
      # vectors, which stay out of the repository, so they are not built here.
      - run: cargo test --release

      # The stage provider that the handoff and conformance suites drive.
      - run: cargo build --release -p neutral-handoff

      # The Python tools need no packages beyond the standard library to
      # compile, so a syntax slip anywhere in them fails here.
      - run: python -m compileall -q tools

      # The handoff control plane and the conformance suite (docs/handoff.md).
      - run: python -I tools/test_handoff.py

      - run: python -I tools/test_conformance.py

      # twixtor is not checked out here (no token, no secret), so every part
      # that needs it prints a NOT RUN line that names the absent peer.
      # --allow-absent-peer lets only those parts through: anything else that
      # does not run, and every failed check, still fails the job.
      - run: python -I tools/conformance.py --quick --allow-absent-peer

      # The generated reference pages and the documentation checks.
      - run: python -I tools/test_docgen.py

      - run: python -I tools/gen_docs.py --check

      - run: python -I tools/check_docs.py
