name: CI

on:
  # Every push to main runs, so main always carries a check of its own, and so
  # does every pull request.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# On a pull request a new push supersedes the run in flight: only the branch's
# latest commit needs a verdict. A push to main is never cancelled and never
# waits behind another one: each is a group of its own, so commits pushed one
# after another all keep a result of their own.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # One platform failing should never hide the result on the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The ffmpeg bridge tests render raw frames with ffmpeg and compare its
      # pixel format table with the live binary, so Linux uses the same static
      # 9.0 build as the other repositories.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSfL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-n9.0-latest-linux64-gpl-9.0/bin" >> "$GITHUB_PATH"

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      # The same static 9.0 build on Windows: the Chocolatey package puts a launcher in
      # front of ffmpeg, and a timeout ends the launcher but not the ffmpeg it started.
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-9.0.zip -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\ffmpeg-n9.0-latest-win64-gpl-9.0\bin"

      # The workspace tests its default members: the harness, the parity
      # replayer, the ffmpeg bridge and the handoff pipeline, in the release
      # profile the parity runs use. The lifted crates need the stored
      # vectors, which stay out of the repository, so they are not built here.
      - run: cargo test --release

      # The stage provider that the handoff and conformance suites drive.
      - run: cargo build --release -p neutral-handoff

      # fx_run, the renderer of the effect stages, builds on every runner.
      - run: cargo build --release -p fx_exec

      # Each of the 16 effect styles renders a fixed synthetic clip at 64x32 and 50x7 through its stage, and the
      # SHA-256 of every output must equal tools/fx_golden.tsv (this repository's own Linux renders). A runner
      # that renders differently fails here and the message names the style.
      - run: python -I tools/fx_golden.py

      # The device foundation (docs/adding-an-effect.md, Device): the kernel source lint, the host simulator, the probe,
      # the self-check corpus and the unsafe scan. They need no device and run on every runner; the tests that need an
      # OpenCL device print NOT RUN where no platform is present.
      - run: cargo test --release -p fx_device -- --test-threads=1

      # The 15 effect crates outside the default members (docs/effects): their tests that need no stored data run;
      # the ones that need the original-derived data print NOT RUN.
      # Linux only: the macOS and Windows results of these tests have not been measured.
      - name: Run the tests of the non-default effect crates that need no stored data
        if: runner.os == 'Linux'
        run: |
          cargo test --release -p fx_eval -p fx_exec -p edge_aware_sharpen_weights -p edge_aware_sharpen_jobs -p edge_aware_sharpen_blur_core -p edge_aware_sharpen_box_filter -p edge_aware_sharpen_render -p edge_aware_sharpen -p sharpen -p warp_render -p make_mipmap -p rotate2d -p interp -p effects_rtdata -p effects_vecdir

      # The Python tools need no packages beyond the standard library to
      # compile, so a syntax slip anywhere in them fails here.
      - run: python -m compileall -q tools

      # The handoff control plane and the conformance suite (docs/handoff.md).
      - run: python -I tools/test_handoff.py

      - run: python -I tools/test_conformance.py

      # twixtor is not checked out here (no token, no secret), so every part
      # that needs it prints a NOT RUN line that names the absent peer.
      # --allow-absent-peer lets only those parts through: anything else that
      # does not run, and every failed check, still fails the job.
      - run: python -I tools/conformance.py --quick --allow-absent-peer

      # The generated reference pages and the documentation checks.
      - run: python -I tools/test_docgen.py

      - run: python -I tools/gen_docs.py --check

      - run: python -I tools/check_docs.py

      # Every effect has golden rows and calls no platform math library.
      - run: python -I tools/test_effect_rules.py

  # The device backend on PoCL (an OpenCL runtime on the CPU, so the self-check runs on a runner with no GPU). It is a job
  # of its own so the tests above never wait on the Ubuntu package mirror. Both jobs are required for a green run.
  device:
    name: device backend on PoCL
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The cache key is built in the shell: the runner image variables are not in the expression context.
      - name: PoCL cache key
        id: pocl-key
        run: |
          list=$(sha256sum tools/ci_install_pocl.sh | cut -c1-16)
          echo "key=pocl-$RUNNER_OS-$RUNNER_ARCH-$ImageOS-$ImageVersion-$list" >> "$GITHUB_OUTPUT"
          echo "prefix=pocl-$RUNNER_OS-$RUNNER_ARCH-" >> "$GITHUB_OUTPUT"

      # The downloaded .deb files. A push to main saves them, so every later pull request restores them.
      - name: Cache PoCL packages
        uses: actions/cache@v6
        with:
          path: ~/pocl-apt-archives
          key: ${{ steps.pocl-key.outputs.key }}
          restore-keys: |
            ${{ steps.pocl-key.outputs.prefix }}

      # Up to 3 attempts of 240 s each, the second on archive.ubuntu.com; the step is bounded below the job limit.
      - name: Install PoCL
        timeout-minutes: 15
        run: |
          export POCL_APT_ARCHIVES="$HOME/pocl-apt-archives"
          bash tools/ci_install_pocl.sh

      # The stage provider and fx_run that the device steps drive.
      - run: cargo build --release -p neutral-handoff

      - run: cargo build --release -p fx_exec

      # Linux with PoCL: every allowlisted op passes the self-check against the CPU kernel, the seam tests run, and the 16
      # styles render through the device backend (SAPPHIRE_DEVICE=gpu) to the same hashes as tools/fx_golden.tsv.
      # SAPPHIRE_REQUIRE_DEVICE=1 turns a missing device into a failure, so an unusable PoCL install cannot pass as NOT RUN.
      # The device integration tests run one binary at a time on one thread: OpenCL platform discovery is not thread safe.
      - name: Device backend on PoCL (self-check and devcheck)
        env:
          SAPPHIRE_REQUIRE_DEVICE: "1"
        run: |
          cargo test --release -p fx_exec --lib device -- --test-threads=1
          cargo test --release -p fx_exec --test device_backend --test device_pointwise --test device_warp --test device_ripmap --test device_neighbourhood -- --test-threads=1
          SAPPHIRE_REQUIRE_DEVICE=1 SAPPHIRE_DEVICE=gpu python -I tools/fx_golden.py
