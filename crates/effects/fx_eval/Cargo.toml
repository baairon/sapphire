
[package]
name = "fx_eval"
version = "0.1.0"
edition = "2021"
description = "Native reader of the effect program language: tokenizer, parser, inlining builder, genotype-equivalent node list"

[lib]
name = "fx_eval"
path = "src/lib.rs"

[[bin]]
name = "fx_eval_cli"
path = "src/main.rs"

[features]
# the own-count mutant (v3_to_v4_if4 takes its own count, not the bound image argument's)
dx2_owncount_mut = []
# the bound-count route mutants: the v3_bound_count flag ignored, and the V3TOV4IF4-COUNT-UNBOUND refusal dropped; each must fail its test
dx2v2_allroutes_mut = []
dx2v2_norefuse_mut = []
brd2_lane0_mut = []
# the single-lane normalize_scale 1 host route reads the frame height in place of the width; must fail t_host_param_ns1
ns1_height_mut = []
# FLD3-FORM: wrong candidate forms and the classifier kept refusing; each must fail t_fld3_form
fld3_form_kept_mut = []
fld3_bcast_mut = []
fld3m_kept_mut = []
fld3m_onelane_mut = []
fld3m_bcast4_mut = []
fld3m_product_mut = []
fld3m_swapped_mut = []
fld3_ownzeros_mut = []
fld3_concat_mut = []
fld3_product_mut = []
brd2_wide_mut = []
int23_a1last_mut = []
int24_lane0v_mut = []
mut_childclear = []
mut_join = []
# the if_neq_const equal-constant mutant without the count conjunct; must fail arm2_differing_counts_even_if_lanes_equal
eqc1_mut_nocount = []
# mutants of the registered 16.16 default rule (never in a shipped build)
df_round_mut = []
df_f32text_mut = []
df_bound_mut = []
df_ns_mut = []
# mutants of the registered popup default rule (never in a shipped build)
pd_text_mut = []
pd_nominus_mut = []

[dependencies]
fx_common = { path = "../fx_common" }
effects_rtdata = { path = "../rtdata" }
libm_sincos = { path = "../kernels/libm_sincos" }
shake_shift = { path = "../kernels/shake_shift" }
tickmap = { path = "../kernels/tickmap" }
warp_noise = { path = "../kernels/warp_noise" }

[dev-dependencies]
effects_vecdir = { path = "../vecdir" }
