
[package]
name = "fx_eval"
version = "0.1.0"
edition = "2021"
description = "Native reader of the effect program language (piece NV-1): tokenizer, parser, inlining builder, genotype-equivalent node list"

[lib]
name = "fx_eval"
path = "src/lib.rs"

[[bin]]
name = "fx_eval_cli"
path = "src/main.rs"

[features]
# step DX2 (W603): the own-count mutant (v3_to_v4_if4 takes its own count, not the bound image argument's)
dx2_owncount_mut = []
# step DX2 v2 (W652 (d)): the flag ignored (DX2 v1) and the refusal dropped; each must fail its test
dx2v2_allroutes_mut = []
dx2v2_norefuse_mut = []
brd2_lane0_mut = []
# FLD3-FORM (W666 (d) 2): wrong candidate forms and the classifier kept refusing; each must fail t_fld3_form
fld3_form_kept_mut = []
fld3_bcast_mut = []
fld3m_kept_mut = []
fld3m_onelane_mut = []
fld3m_bcast4_mut = []
fld3m_product_mut = []
fld3m_swapped_mut = []
fld3_ownzeros_mut = []
fld3_concat_mut = []
fld3_product_mut = []
brd2_wide_mut = []
int23_a1last_mut = []
int24_lane0v_mut = []
mut_childclear = []
mut_join = []
# INT21 step Q (W491, W170): the EQC1 mutant without the count conjunct; must fail arm2_differing_counts_even_if_lanes_equal
eqc1_mut_nocount = []
# INT32 step DF (W605 (c) 5): mutants of the registered 16.16 default rule (never in a shipped build)
df_round_mut = []
df_f32text_mut = []
df_bound_mut = []
df_ns_mut = []

[dependencies]
effects_rtdata = { path = "../rtdata" }
libm_sincos = { path = "../ext/wave_s4/rebuild_sincos/port" }
tickmap = { path = "../crates/tickmap" }

[dev-dependencies]
effects_vecdir = { path = "../vecdir" }
