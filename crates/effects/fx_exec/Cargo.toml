
[package]
name = "fx_exec"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native f32 executor of the compiled effect plan: selector over the real combo tables, builtin crates as kernels, HOST-FRAMES inputs"

[lib]
name = "fx_exec"
path = "src/lib.rs"

[[bin]]
name = "fx_exec_cli"
path = "src/main.rs"

[dependencies]
effects_rtdata = { path = "../rtdata" }
fx_device = { path = "../fx_device" }
fx_eval = { path = "../fx_eval" }
convert_pair = { path = "../kernels/convert_pair" }
# Format-14 source readers R4, R3, R1
format14_read = { path = "../kernels/format14_read" }
# Code-14 destination zero-arm bodies and the row copier (14, 14), R-PARITY (FLOOR PENDING)
format14_write = { path = "../kernels/format14_write" }
# Variant-B format-14 readers, R-PARITY (FLOOR PENDING second reader)
format14_read_b = { path = "../kernels/format14_read_b" }
plane_service = { path = "../kernels/plane_service" }
glint_wire = { path = "../kernels/glint_wire" }
glint_pass_rows = { path = "../kernels/glint_pass_rows" }
glint_pass_cols = { path = "../kernels/glint_pass_cols" }
glint_dispatch = { path = "../kernels/glint_dispatch" }
glint_worker = { path = "../kernels/glint_worker" }
glint_diag_box = { path = "../kernels/glint_diag_box" }
diagonal_box_sum = { path = "../kernels/diagonal_box_sum" }
hue_shift = { path = "../kernels/hue_shift" }
sat_scale = { path = "../kernels/sat_scale" }
hue_shift_preserve_luma = { path = "../kernels/hue_shift_preserve_luma" }
v3_to_v4_if4 = { path = "../kernels/v3_to_v4_if4" }
v3_to_v4_if4_a = { path = "../kernels/v3_to_v4_if4_a" }
get_alpha = { path = "../kernels/get_alpha" }
ops_arith = { path = "../kernels/ops_arith" }
ops_minmax = { path = "../kernels/ops_minmax" }
ops_if = { path = "../kernels/ops_if" }
comp_rgba = { path = "../kernels/comp_rgba" }
one_minus = { path = "../kernels/one_minus" }
screen_super = { path = "../kernels/screen_super" }
overlay_super = { path = "../kernels/overlay_super" }
screen = { path = "../kernels/screen" }
ops_element = { path = "../kernels/ops_element" }
alpha_from_rgb_max = { path = "../kernels/alpha_from_rgb_max" }
ops_vec = { path = "../kernels/ops_vec" }
ops_diff = { path = "../kernels/ops_diff" }
ops_clamp = { path = "../kernels/ops_clamp" }
interp = { path = "../kernels/interp" }
dissolve = { path = "../kernels/dissolve" }
sharpen = { path = "../kernels/sharpen" }
add_rgb = { path = "../kernels/add_rgb" }
masked_blur = { path = "../kernels/masked_blur" }
comp_premult = { path = "../kernels/comp_premult" }
copy_planes = { path = "../kernels/copy_planes" }
copy_alpha = { path = "../kernels/copy_alpha" }
grad = { path = "../kernels/grad" }
edge_detect = { path = "../kernels/edge_detect" }
warp_render = { path = "../kernels/warp_render" }
warp_log_gradient = { path = "../kernels/warp_log_gradient" }
monochrome_a = { path = "../kernels/monochrome_a" }
scale_rgb = { path = "../kernels/scale_rgb" }

make_mipmap = { path = "../kernels/make_mipmap" }
blur_warp = { path = "../kernels/blur_warp" }
warp_rel = { path = "../kernels/warp_rel" }
warp_sampler = { path = "../kernels/warp_sampler" }
static2 = { path = "../kernels/static2" }
tilt_alpha = { path = "../kernels/tilt_alpha" }
monochrome = { path = "../kernels/monochrome" }
rotate2d = { path = "../kernels/rotate2d" }
libm_sincos = { path = "../kernels/libm_sincos" }
tilt = { path = "../kernels/tilt" }
ops_coerce = { path = "../kernels/ops_coerce" }
blur = { path = "../kernels/blur" }
blur_channels = { path = "../kernels/blur_channels" }
glow_layer = { path = "../kernels/glow_layer" }
blur_coef = { path = "../kernels/blur_coef" }
edge_aware_sharpen_jobs = { path = "../kernels/edge_aware_sharpen_jobs" }
libm_powf = { path = "../kernels/libm_powf" }
edge_aware_sharpen_blur_core = { path = "../kernels/edge_aware_sharpen_blur_core" }
edge_aware_sharpen_box_filter = { path = "../kernels/edge_aware_sharpen_box_filter" }
edge_aware_sharpen_render = { path = "../kernels/edge_aware_sharpen_render" }
edge_aware_sharpen = { path = "../kernels/edge_aware_sharpen" }
fx_common = { path = "../fx_common" }

[features]
# Class-3 VB4 mutants: the path read through R4, and the wrong lanes handed over; each must fail the dsoc1rec line
svb1_r4_mut = []
svb1_lane_mut = []
# Mutant: the two-lane host route with the width fixed at 64; must fail K_50x7 (and every 50x7 and 49x9 row with a shift)
nss1_w64_mut = []
# the single-lane normalize_scale 1 host route reads the frame height in place of the width; must fail fx_eval's t_host_param_ns1
ns1_height_mut = ["fx_eval/ns1_height_mut"]
# FLD3-FORM: wrong candidate forms and the classifier kept refusing; each must fail t_fld3_form
fld3_form_kept_mut = ["fx_eval/fld3_form_kept_mut"]
fld3_bcast_mut = ["fx_eval/fld3_bcast_mut"]
fld3m_kept_mut = ["fx_eval/fld3m_kept_mut"]
fld3m_onelane_mut = ["fx_eval/fld3m_onelane_mut"]
fld3m_bcast4_mut = ["fx_eval/fld3m_bcast4_mut"]
fld3m_product_mut = ["fx_eval/fld3m_product_mut"]
fld3m_swapped_mut = ["fx_eval/fld3m_swapped_mut"]
fld3_ownzeros_mut = ["fx_eval/fld3_ownzeros_mut"]
fld3_concat_mut = ["fx_eval/fld3_concat_mut"]
fld3_product_mut = ["fx_eval/fld3_product_mut"]
# Mutant: Output at the minimal-context default on the 'ae32' route; must fail t_dx2_claim_d64
dx2_output_default_mut = []
dx2_owncount_mut = ["fx_eval/dx2_owncount_mut"]
dx2v2_allroutes_mut = ["fx_eval/dx2v2_allroutes_mut"]
dx2v2_norefuse_mut = ["fx_eval/dx2v2_norefuse_mut"]
# The alias mutant (the alias falls to the constant default path); must fail int31_alias_tests
al_const_mut = []
# ENVFENCE mutants; each must fail t_envfence
envfence_dropname_mut = []
envfence_tail_mut = []
envfence_nv3e_mut = []
# The opacity mutants; each must fail int31_l2_tests
l2_textconv_mut = []
l2_nominus_mut = []
# the registered popup default mutants; each must fail the popup default tests
pd_text_mut = ["fx_eval/pd_text_mut"]
pd_nominus_mut = ["fx_eval/pd_nominus_mut"]
l2_hostignored_mut = []
# The output_opacity mutants; each must fail the l2b tests in int31_l2_tests
l2b_outset_taken_mut = []
l2b_value_eq_mut = []
l2b_cset_input_as_opacity_mut = []
# POPUP-ANSWER-OUT-OF-RANGE mutants; each must fail g2_popup_tests and t_popup_range
popup_range_off_mut = []
popup_range_zero_based_mut = []
popup_range_nolow_mut = []
popup_range_nohigh_mut = []
# History mutants; each must fail its discriminating test
hpt1_always_keep_mut = []
hpt1_always_restart_mut = []
hpt1_unfused_mut = []
# OWNER-OPACITY-DERIVED note mutant: the old condition; must fail t_owner_note
owner_note_set_mut = []
brd2_lane0_mut = ["fx_eval/brd2_lane0_mut"]
brd2_wide_mut = ["fx_eval/brd2_wide_mut"]
int23_a1last_mut = ["fx_eval/int23_a1last_mut"]
int24_lane0v_mut = ["fx_eval/int24_lane0v_mut"]
# Record lane-bits feed mutants; each must fail g2_lane_tests
lane_bits_masked_mut = []
lane_negzero_folded_mut = []
mutants = ["convert_pair/mutants"]
drw2_mut = ["grad/mutants"]
# The RAW variant of the constant binding (no fill) for the 33-original gate's discrimination half; never in a shipped build
cst1_raw_cp = []
# Gate control: the fill-with-0 mutant; must fail the 33-original gate
fill0_mut = []
# The routing mutant: R3 read by the variant-B line; must fail t35_r3_dr2h_rows
g3r_mut_r3b = []
# Mode-3 mutants: the refusal kept at mode 3 with 1 plane; the 3-plane body at 1 plane; each must fail the m3p2 tests
m3p2_refusal_kept_mut = []
m3p2_threeplane_body_mut = []

[dev-dependencies]
effects_vecdir = { path = "../vecdir" }
