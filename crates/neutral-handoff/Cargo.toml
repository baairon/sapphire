[package]
name = "neutral-handoff"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Pipeline that hands raw frames from ffmpeg to twixtor's vfx and back to ffmpeg, with the plan, commands and checks of tools/apply.py (std only)"

[lib]
name = "neutral_handoff"
path = "src/lib.rs"

[[bin]]
name = "sapphire"
path = "src/main.rs"

# A stand-in for twixtor's `vfx` that the tests run. It speaks the same command line
# (`list --json --all`, `apply ... --check`, raw frames on stdin and stdout) and has
# effects that misbehave on purpose.
[[bin]]
name = "fake-vfx"
path = "src/bin/fake_vfx.rs"

[dependencies]
neutral-ffmpeg = { path = "../neutral-ffmpeg" }
